name: Register Push

# 날씨 페이지의 "이 기기 알림 등록하기" → 제목이 "알림 등록"으로 시작하는 이슈 작성
# → 암호화된 구독을 push-subscriptions.json 에 추가·커밋 → 확인 알림 → 이슈 닫기
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: subscriptions
  cancel-in-progress: false

jobs:
  register:
    # 저장소 주인이 쓴 알림 등록 이슈만 처리한다.
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '알림 등록')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: 구독 추가
        id: sub
        run: node scripts/add-subscription.js
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          SUB_ENC_PRIVATE_KEY: ${{ secrets.SUB_ENC_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push-subscriptions.json
          git diff --cached --quiet || { git commit -m "알림 기기 등록 (${{ steps.sub.outputs.count }}대)"; git pull --rebase; git push; }
      - name: 이슈 닫기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "알림 기기를 등록했습니다 (총 ${{ steps.sub.outputs.count }}대). 방금 확인 알림을 보냈습니다."
      - name: 실패 안내
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "알림 등록에 실패했습니다. 페이지에서 다시 시도하거나 Actions 로그를 확인해 주세요."
