name: Register Push

# 날씨 페이지의 "이 기기 알림 등록하기" → 제목이 "알림 등록"으로 시작하는 이슈 작성
# → 암호화된 구독을 push-subscriptions.json 에 추가·커밋 → 확인 알림 → 이슈 닫기
# 누구의 GitHub 계정이든 등록할 수 있다 (다른 계정은 1인당 3대, 전체 30대 제한 — scripts/add-subscription.js).
# 이슈를 다시 열어도(reopened) 처리한다.
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  actions: write # 등록 후 화면(기기별 날씨 파일) 다시 배포

concurrency:
  group: subscriptions
  cancel-in-progress: false

jobs:
  register:
    if: startsWith(github.event.issue.title, '알림 등록')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: 구독 추가
        id: sub
        run: node scripts/add-subscription.js
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          SUB_ENC_PRIVATE_KEY: ${{ secrets.SUB_ENC_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push-subscriptions.json
          git diff --cached --quiet || { git commit -m "알림 기기 등록 (${{ steps.sub.outputs.count }}대)"; git pull --rebase; git push; }
      # GITHUB_TOKEN 으로 한 push 는 다른 워크플로를 깨우지 않으므로 직접 실행한다.
      - name: 기기별 날씨 화면 다시 배포
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 이슈 닫기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "알림 기기를 등록했습니다. 방금 그 기기로 확인 알림을 보냈습니다."
      - name: 실패 안내
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.sub.outputs.error }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "알림 등록에 실패했습니다. ${REASON:-Actions 로그를 확인해 주세요.}"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason "not planned"
