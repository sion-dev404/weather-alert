name: Morning Weather

on:
  schedule:
    # GitHub Actions cron은 UTC 기준. KST 06:30 = UTC 21:30 (전날)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Send weather (웹 푸시)
        run: node send-weather.js
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          NX: ${{ secrets.NX }}
          NY: ${{ secrets.NY }}
          LOCATION_NAME: ${{ vars.LOCATION_NAME }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
