name: Morning Weather

on:
  schedule:
    # GitHub Actions cron은 UTC 기준. KST 06:30 = UTC 21:30 (전날)
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      always:
        description: '조건(매우 더움·추움·비/눈)과 관계없이 보내기 (시험용)'
        type: boolean
        default: false

permissions:
  contents: write # 만료된 구독을 push-subscriptions.json 에서 지우고 커밋하기 위해

concurrency:
  group: subscriptions
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Send weather (웹 푸시)
        run: node send-weather.js ${{ inputs.always && '--always' || '' }}
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          NX: ${{ secrets.NX }}
          NY: ${{ secrets.NY }}
          LOCATION_NAME: ${{ vars.LOCATION_NAME }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUB_ENC_PRIVATE_KEY: ${{ secrets.SUB_ENC_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
      - name: 만료된 구독 정리 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push-subscriptions.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "만료된 알림 구독 정리"; git pull --rebase; git push; }
